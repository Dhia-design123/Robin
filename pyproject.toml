[project]
name = "friday-tony-stark-demo"
version = "0.1.0"
description = "Friday — A Tony Stark-inspired MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "httpx",
    "keyboard>=0.13.5",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "playsound==1.2.2",
    "pystray>=0.19.5",
    "python-dotenv",
    "pywebview>=6.2.1",
    "scipy>=1.17.1",
    "setuptools>=83.0.0",
    "sounddevice>=0.5.5",
    "win11toast>=0.36.3",
    "supabase>=2.0.0",
    "py-vapid>=1.9.4",
    "pywebpush>=2.3.0",
]

[project.scripts]
friday = "server:main"
robin_voice = "agent_robin:dev" # Points to the wrapper

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]
